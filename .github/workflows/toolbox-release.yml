name: Publish toolbox attachment
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag (for example v1.1.5)
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: toolbox-package-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    uses: PhysicalWorldDo/DNFTOOLBOX-Registry/.github/workflows/package-tool.yml@main
    with:
      tool-id: rep_player
      tag: ${{ github.event.release.tag_name || inputs.tag }}
